[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicte-ai-service"
version = "1.0.0"
description = "Pluggable AI/ML Service for AICTE Validation Desk (SIH 2026 PS 26261)"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
